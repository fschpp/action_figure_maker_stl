# Publica web/ en GitHub Pages (plan §9). Requiere: Settings → Pages → Source: GitHub Actions.
# El wheel de manifold3d para Pyodide sale del Release `manifold3d-pyodide-<ver>` (lo publica el workflow manifold-wheel).
# Pages todavía no está habilitado en el repo (deploy da 404): Settings → Pages → Source: GitHub Actions.
name: pages
on:
  push: { branches: [main] }
  workflow_dispatch: {}
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      - run: pip install setuptools wheel
      - name: Wheel de manifold3d para Pyodide (Release)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release download manifold3d-pyodide-3.5.5 --pattern '*.whl' --dir extra
      - name: Wheel de fast-simplification para Pyodide (Release; decimación del torso, ver fastsimp-wheel.yml)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release download fast-simplification-pyodide-0.2.0 --pattern '*.whl' --dir extra
      - name: Test de la comprobación de versión (web/version.js)
        run: node web/tests/version_node.mjs
      - run: scripts/build_web.sh extra
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
