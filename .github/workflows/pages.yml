# Publica web/ en GitHub Pages (plan §9). Requiere: Settings → Pages → Source: GitHub Actions.
# ESTADO: SIN PROBAR. Mientras no exista el wheel de manifold3d para Pyodide (workflow manifold-wheel), el motor
# se instala pero "Generar" falla al importar manifold3d. Cuando exista, bajarlo de Releases a un directorio y
# pasarlo como argumento de scripts/build_web.sh.
name: pages
on:
  push: { branches: [main] }
  workflow_dispatch: {}
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      - run: pip install setuptools wheel
      - run: scripts/build_web.sh
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
