<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Action Figure Maker — articulá tu figura en el navegador</title>
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
  {"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}
  </script>
</head>
<body>
  <main>
    <h1>Action Figure Maker STL</h1>
    <p>Cargá un STL de una pieza y un proyecto, y descargá la figura articulada. Todo se calcula en tu navegador: ningún archivo sale de tu equipo.</p>

    <section>
      <button id="demo">Probar con la figura de demostración</button>
      <hr>
      <label>STL de la figura <input id="stl" type="file" accept=".stl"></label>
      <label>Proyecto (.proyecto / .json) <input id="proj" type="file" accept=".proyecto,.json"></label>
      <button id="build" disabled>Generar</button>
      <p id="stlinfo" aria-live="polite"></p>
    </section>

    <section id="vista" hidden>
      <h2>Vista del modelo</h2>
      <div class="barra">
        <button data-view="front">Frente</button><button data-view="back">Espalda</button>
        <button data-view="right">Derecha</button><button data-view="left">Izquierda</button><button data-view="top">Arriba</button>
      </div>
      <canvas id="canvas" width="640" height="480"></canvas>
      <div class="barra">
        <button id="pick-sym">Plano de simetría (3 clics)</button>
        <button id="pick-arm">Plano del brazo (3 clics)</button>
        <button id="pick-leg">Plano de la pierna (3 clics)</button>
        <button id="pick-head">Plano del cuello (3 clics)</button>
        <button id="pick-waist">Plano de la cintura (3 clics)</button>
        <button id="half">Atenuar una mitad: no</button>
        <button id="pick-crown">Marcar coronilla (1 clic)</button>
        <label>Frente de la figura <select id="front"><option value="+Y">+Y</option><option value="-Y">−Y</option></select></label>
      </div>
      <p id="pickinfo" aria-live="polite"></p>
    </section>

    <progress id="bar" max="100" value="0" hidden></progress>
    <p id="stage" aria-live="polite"></p>
    <p id="result" hidden><a id="download" download="figura.zip">Descargar ZIP</a></p>
    <h2 id="reph" hidden>Informe de validación</h2>
    <pre id="report" hidden></pre>
    <pre id="log"></pre>

    <footer class="verbar">
      <span id="version-label">Versión: …</span>
      <button id="check-update" type="button">Buscar actualización</button>
      <span id="update-status" aria-live="polite"></span>
    </footer>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
